# Despertador automático: acessa o banco a cada 3 dias para o Supabase
# (plano grátis) não pausar o projeto por inatividade. Não lê nem altera dados.
name: Manter banco ativo

on:
  schedule:
    - cron: "17 11 */3 * *"   # a cada 3 dias, por volta das 08:17 (horário de Brasília)
  workflow_dispatch:           # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a função ping do Supabase
        run: |
          resposta=$(curl -sS -m 30 -X POST \
            "https://xafbnwjxypdzizntkboh.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_PQhSXGWpCE77hQ32vwUIDg_ThiBaZPw" \
            -H "Content-Type: application/json" \
            -d '{}' -w "\n%{http_code}")
          echo "$resposta"
          codigo=$(echo "$resposta" | tail -n1)
          if [ "$codigo" != "200" ]; then
            echo "O banco não respondeu como esperado (HTTP $codigo)."
            exit 1
          fi
